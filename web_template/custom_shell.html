<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="screen-orientation" content="portrait">
		<meta name="x5-orientation" content="portrait">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100vw;
	height: 100vh;
	height: 100dvh;
	overflow: hidden;
	position: fixed;
	background-color: #040407;
	color: white;
	touch-action: none;
	-webkit-touch-callout: none;
	-webkit-user-select: none;
	user-select: none;
}

#canvas {
	display: block;
	width: 100% !important;
	height: 100% !important;
	height: 100dvh !important;
	object-fit: contain;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #08090c;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 100;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 12%;
	width: 50%;
	max-width: 280px;
	height: 8px;
	margin: 0 auto;
	accent-color: #00f2fe;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 101;
}

/* Landscape orientation blocker on mobile devices */
#rotate-overlay {
	display: none;
	position: fixed;
	top: 0;
	left: 0;
	width: 100vw;
	height: 100vh;
	background: #040407;
	color: #38bdf8;
	z-index: 999999;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	text-align: center;
	padding: 24px;
	box-sizing: border-box;
}

#rotate-overlay .phone-rotate-icon {
	font-size: 56px;
	margin-bottom: 18px;
	animation: pulse-rotate 2.2s infinite ease-in-out;
}

@keyframes pulse-rotate {
	0%, 15% { transform: rotate(90deg) scale(1); }
	45%, 70% { transform: rotate(0deg) scale(1.1); }
	100% { transform: rotate(90deg) scale(1); }
}

@media screen and (orientation: landscape) and (max-height: 560px) {
	#rotate-overlay {
		display: flex !important;
	}
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="rotate-overlay">
			<div class="phone-rotate-icon">📱</div>
			<div style="font-size: 20px; font-weight: 700; letter-spacing: 1px; color: #38bdf8; margin-bottom: 8px;">PLEASE ROTATE YOUR DEVICE</div>
			<div style="font-size: 14px; color: #94a3b8; max-width: 320px;">Hopy is designed for vertical portrait play. Hold your phone upright to jump!</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Hardware Device Orientation / Accelerometer / Gyroscope Bridge for Web
(function() {
	var gyroState = {
		tilt: 0.0,
		rawX: 0.0,
		hasOrientation: false,
		hasMotion: false,
		permissionGranted: false
	};
	window.hopyGyro = gyroState;

	function updateTilt(deg) {
		if (deg !== null && deg !== undefined && !isNaN(deg)) {
			gyroState.tilt = Math.max(-90.0, Math.min(90.0, deg));
		}
	}

	function handleOrientation(e) {
		if (e.gamma !== null && e.gamma !== undefined) {
			gyroState.hasOrientation = true;
			var angle = (window.screen && window.screen.orientation && window.screen.orientation.angle) || window.orientation || 0;
			var g = e.gamma;
			var b = e.beta;
			if (angle === 90) {
				updateTilt(b);
			} else if (angle === -90 || angle === 270) {
				updateTilt(-b);
			} else if (angle === 180) {
				updateTilt(-g);
			} else {
				updateTilt(g);
			}
		}
	}

	function handleMotion(e) {
		var acc = e.accelerationIncludingGravity || e.acceleration;
		if (acc && acc.x !== null && acc.x !== undefined) {
			gyroState.hasMotion = true;
			gyroState.rawX = acc.x;
			// If deviceorientation is unavailable or flat, derive tilt from accelerometer X
			// In portrait: tilt right is negative on iOS/standard, or positive on some Android
			if (!gyroState.hasOrientation || Math.abs(gyroState.tilt) < 0.2) {
				updateTilt(acc.x * 6.0);
			}
		}
	}

	// 1. Immediately listen on window and document (Android Chrome, Firefox, etc.)
	try {
		window.addEventListener('deviceorientation', handleOrientation, true);
		window.addEventListener('deviceorientationabsolute', handleOrientation, true);
		window.addEventListener('devicemotion', handleMotion, true);
		document.addEventListener('deviceorientation', handleOrientation, true);
		document.addEventListener('devicemotion', handleMotion, true);
	} catch (err) {}

	// 2. Generic Sensor API for modern Chrome Android
	if (typeof RelativeOrientationSensor !== 'undefined') {
		try {
			var sensor = new RelativeOrientationSensor({ frequency: 60 });
			sensor.addEventListener('reading', function() {
				if (sensor.quaternion) {
					var q = sensor.quaternion;
					var sinr_cosp = 2 * (q[3] * q[0] + q[1] * q[2]);
					var cosr_cosp = 1 - 2 * (q[0] * q[0] + q[1] * q[1]);
					var roll = Math.atan2(sinr_cosp, cosr_cosp) * (180.0 / Math.PI);
					gyroState.hasOrientation = true;
					updateTilt(roll);
				}
			});
			sensor.start();
		} catch (err) {}
	} else if (typeof Accelerometer !== 'undefined') {
		try {
			var acl = new Accelerometer({ frequency: 60 });
			acl.addEventListener('reading', function() {
				if (acl.x !== null && (!gyroState.hasOrientation || Math.abs(gyroState.tilt) < 0.2)) {
					gyroState.hasMotion = true;
					updateTilt(acl.x * 6.0);
				}
			});
			acl.start();
		} catch (err) {}
	}

	// 3. User-gesture permission trigger (required by iOS 13+ Safari)
	window.hopyRequestGyroPermission = function() {
		if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
			DeviceOrientationEvent.requestPermission().then(function(state) {
				if (state === 'granted') {
					gyroState.permissionGranted = true;
					window.addEventListener('deviceorientation', handleOrientation, true);
					window.addEventListener('devicemotion', handleMotion, true);
				}
			}).catch(function() {});
		}
		if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
			DeviceMotionEvent.requestPermission().then(function(state) {
				if (state === 'granted') {
					window.addEventListener('devicemotion', handleMotion, true);
				}
			}).catch(function() {});
		}
	};

	window.hopyGetTilt = function() {
		return gyroState.tilt;
	};

	// Request mobile vertical fullscreen and trigger sensor permissions on user interaction
	function onUserInteraction() {
		window.hopyRequestGyroPermission();

		const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
			(navigator.maxTouchPoints && navigator.maxTouchPoints > 1 && window.innerHeight > window.innerWidth);
		if (!isMobile) return;
		
		const elem = document.documentElement;
		if (!document.fullscreenElement && !document.webkitFullscreenElement) {
			const req = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.msRequestFullscreen;
			if (req) {
				req.call(elem).then(() => {
					if (screen.orientation && screen.orientation.lock) {
						screen.orientation.lock('portrait').catch(() => {});
					}
				}).catch(() => {});
			}
		} else if (screen.orientation && screen.orientation.lock) {
			screen.orientation.lock('portrait').catch(() => {});
		}
	}

	window.addEventListener('touchstart', onUserInteraction, { passive: true });
	window.addEventListener('pointerdown', onUserInteraction, { passive: true });
	window.addEventListener('click', onUserInteraction, { passive: true });
})();

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
