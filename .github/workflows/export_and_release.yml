name: Build & Release Web and Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    name: Export Web & Android
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Create Keystores
        run: |
          mkdir -p ~/.local/share/godot/keystores
          # Create debug keystore
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/.local/share/godot/keystores/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          # Create release keystore matching project settings
          keytool -keyalg RSA -genkeypair -alias hopy \
            -keypass hopygame -keystore ~/.local/share/godot/keystores/release.keystore \
            -storepass hopygame -dname "CN=Hopy,O=Dev,C=US" -validity 10000

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat << 'EOF' > ~/.config/godot/editor_settings-4.7.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/debug_keystore = "~/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.*/x64"
          export/android/android_sdk_path = "${{ env.ANDROID_HOME }}"
          EOF

      - name: Export Web & Android
        run: |
          mkdir -p build/web build/android
          godot --headless --export-release "Web" build/web/index.html
          (cd build/web && zip -q -r ../Hopy-Web.zip ./*)
          godot --headless --export-release "Android" build/android/Hopy.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hopy-builds
          path: |
            build/Hopy-Web.zip
            build/android/Hopy.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Hopy-Web.zip
            build/android/Hopy.apk
          draft: false
          prerelease: false
